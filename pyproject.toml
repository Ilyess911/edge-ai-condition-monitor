[project]
name = "edge-ai-condition-monitor"
version = "0.1.0"
description = "Real-time Edge AI prototype for equipment condition monitoring, combining streaming sensor data, lightweight anomaly detection and deployment-oriented benchmarking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ilyess Assadi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "skl2onnx>=1.17", "onnxruntime>=1.18"]
viz = ["matplotlib>=3.8"]
dashboard = ["streamlit>=1.36"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
